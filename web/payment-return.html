<!DOCTYPE html>
<!--
  Where SumUp sends people back after paying in the apps (CheckoutLauncher.redirectUrl):
  /payment-return.html?to=/balance/topUp/success/<reference> or ?to=/donate/<id>/success/<reference>.
  A redirect never opens an app by itself, so this page opens dukapp://app<to> (the app shows the result and closes
  the in-app browser) and offers a button for when the browser blocks that, plus the web app as a fallback.
  Only the two result routes are accepted, so the page can't be used to send people anywhere else.
-->
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DukApp</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f6ef; --text: #1d1f17; --primary: #5a614a; --on-primary: #ffffff; --hint: #6b6e63; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14150f; --text: #ecebe2; --primary: #c3cba6; --on-primary: #1d1f17; --hint: #a3a597; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg);
           color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 360px; padding: 24px 16px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--hint); line-height: 1.4; }
    a.button { display: block; padding: 14px 16px; border-radius: 14px; background: var(--primary); color: var(--on-primary);
               text-decoration: none; font-weight: 600; font-size: 17px; }
    a.web { display: inline-block; margin-top: 18px; color: var(--primary); font-size: 15px; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Fizetés befejezve</h1>
  <p id="text">Visszaviszünk a DukAppba, ahol látod, sikerült-e a fizetés.</p>
  <a class="button" id="app" href="#">Vissza a DukAppba</a>
  <a class="web" id="web" href="/">Folytatás a webes alkalmazásban</a>
</main>
<script>
  (function () {
    var english = !/^hu/i.test(navigator.language || "");
    if (english) {
      document.documentElement.lang = "en";
      document.getElementById("title").textContent = "Payment finished";
      document.getElementById("text").textContent = "Taking you back to DukApp, where you'll see whether the payment went through.";
      document.getElementById("app").textContent = "Back to DukApp";
      document.getElementById("web").textContent = "Continue in the web app";
    }
    var to = new URLSearchParams(window.location.search).get("to") || "";
    // The result pages only; the reference may hold letters, digits, - _ . and the [ ] of donation references
    var ok = /^\/(balance\/topUp\/success|donate\/\d+\/success)\/[A-Za-z0-9_.\-\[\]]+$/.test(to);
    if (!ok) {
      document.getElementById("app").style.display = "none";
      return;
    }
    var path = to.split("/").map(encodeURIComponent).join("/");
    var appLink = "dukapp://app" + path;
    document.getElementById("app").href = appLink;
    document.getElementById("web").href = path;
    window.location.href = appLink;
  })();
</script>
</body>
</html>
