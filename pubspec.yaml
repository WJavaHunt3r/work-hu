name: work_hu
description: See the status of the competition. Follow your MyShare status and much more.
publish_to: 'none'

version: 2.0.15+17

environment:
  sdk: '>=3.8.0<4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  cupertino_icons: ^1.0.2
  syncfusion_flutter_gauges: ^34.2.9
  dio: ^5.4.1
  overlay_support: ^2.0.0
  get_it: ^9.3.0
  flutter_screenutil: ^5.9.3
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^18.0.1
  flutter_web_frame: ^1.0.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.1
  bcrypt: ^1.1.3
  pointycastle: ^4.0.0
  intl: ^0.20.2
  excel: ^4.0.2
  file_picker: ^13.1.0
  csv: ^8.0.0
  file_saver: ^0.5.0
  drop_down_search_field: ^1.3.0
  flutter_localizations:
    sdk: flutter
  localization: ^2.1.1
  http_parser: ^4.0.2
  flutter_svg: ^2.0.10+1
  info_widget: ^1.0.0
  gif: ^2.3.0
  syncfusion_flutter_charts: ^34.2.9
  shimmer: ^4.0.0
  url_launcher: ^6.3.1
  universal_io: ^2.2.2
  shared_preferences: ^2.5.3
  google_sign_in: ^7.2.0
  barcode_widget: 2.0.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  flutter_localized_locales: ^2.0.5
  flutter_slidable: ^4.0.3
  package_info_plus: ^10.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.3.3
  mocktail: ^1.0.3
  auto_route_generator:
  injectable_generator: ^3.1.3
  freezed: ^4.0.1
  json_serializable: ^6.7.1


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/img/
    - assets/logos/
    - assets/logos/dark/
    - assets/logos/light/
    - assets/icons/
    - assets/docs/
    - lib/
    - lib/I18n/

  generate: true

  fonts:
    - family: Good-Timing
      fonts:
        - asset: assets/fonts/Good-Timing-Light.ttf
        - asset: assets/fonts/Good-Timing-Bold.otf
          weight: 800
